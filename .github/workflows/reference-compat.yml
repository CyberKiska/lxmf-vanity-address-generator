name: Reference compatibility

on:
  workflow_call:
    inputs:
      use_release_binary:
        description: Test the Linux/amd64 artifact built by the calling workflow
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      rns: ${{ steps.resolve.outputs.rns }}
      lxmf: ${{ steps.resolve.outputs.lxmf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !inputs.use_release_binary }}
        env:
          GOTOOLCHAIN: auto # Let the pinned action select go.mod's toolchain; it then sets local.
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the standalone reference-check binary
        if: ${{ !inputs.use_release_binary }}
        run: |
          set -eu
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" {print $2}' go.mod)"
          make build BINARY=lxmf-vanity-linux-amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.use_release_binary
        with:
          name: lxmf-vanity-linux-amd64
      - name: Verify the release executable
        if: inputs.use_release_binary
        run: |
          set -eu
          sha256sum -c lxmf-vanity-linux-amd64.sha256
          chmod u+x lxmf-vanity-linux-amd64
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - name: Resolve current stable reference versions
        id: resolve
        run: python scripts/install_reference.py --resolve-only
      - name: Install exact selected wheels and hashed dependencies
        run: |
          python -m venv .venv
          .venv/bin/python scripts/install_reference.py
      - name: Mandatory core and explicitly classified interop checks
        shell: bash
        run: |
          set -euo pipefail
          for provider in pyca internal; do
            .venv/bin/python scripts/rns_compatibility_oracle.py \
              --check testdata/rns-identity-vectors.json --binary lxmf-vanity-linux-amd64 \
              --checks core --lxmf required --provider "$provider" 2>&1 | tee -a reference-checks.log
            status=0
            .venv/bin/python scripts/rns_compatibility_oracle.py \
              --binary lxmf-vanity-linux-amd64 --checks interop --provider "$provider" \
              2>&1 | tee -a reference-checks.log || status=$?
            if [ "$status" -eq 3 ]; then
              echo "::warning::Recognised rnid interface drift; requested interop checks were not completed."
              echo "Interop ($provider): recognised interface drift, checks skipped." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done
      - name: Verify an identity with the independent manual verifier
        run: |
          set -eu
          identity_dir=$(mktemp -d)
          trap 'rm -rf -- "$identity_dir"' EXIT
          ./lxmf-vanity-linux-amd64 --prefix 0 --workers 1 --out "$identity_dir/saved"
          .venv/bin/python verify.py "$identity_dir/saved" --manual-only
      - name: Record selected versions, provider output and wheel provenance
        if: always()
        env:
          SELECTED_RNS: ${{ steps.resolve.outputs.rns }}
          SELECTED_LXMF: ${{ steps.resolve.outputs.lxmf }}
        run: |
          printf 'Selected references: RNS %s; LXMF %s\n' "$SELECTED_RNS" "$SELECTED_LXMF" >> "$GITHUB_STEP_SUMMARY"
          for report in reference-provenance.json reference-checks.log; do
            if [ -f "$report" ]; then
              printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reference-provenance
          if-no-files-found: warn
          path: |
            reference-selection.json
            reference-install.json
            dependencies-install.json
            reference-provenance.json
            reference-checks.log

