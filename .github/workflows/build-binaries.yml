name: Build binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BINARY_BASENAME: lxmf-vanity
  RNS_REFERENCE_VERSION: 1.4.2
  RNS_REFERENCE_COMMIT: b48b96e61676504e0a4e527b33b9a0b4495c6872

jobs:
  platform-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go unit tests
        run: go test -count=1 ./...

  security-tests:
    name: Security, race and fuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go security checks
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go test -run '^$' -fuzz '^FuzzAddressMatcher$' -fuzztime=5s

      - name: Verification script tests
        run: python3 -m unittest -v verify_test.py

      - name: FIPS-only mode fails gracefully
        run: |
          go build -buildmode=pie -trimpath -buildvcs=false -o "${BINARY_BASENAME}" .
          if GODEBUG=fips140=only ./"${BINARY_BASENAME}" --prefix 0 --workers 1 --dry-run >fips-only.log 2>&1; then
            echo "expected X25519 to be unavailable in FIPS-only mode"
            exit 1
          fi
          if grep -q "panic:" fips-only.log; then
            cat fips-only.log
            exit 1
          fi
          grep -q "X25519 public-key derivation unavailable" fips-only.log

  compatibility:
    name: RNS 1.4.2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Reticulum reference
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            "rns @ git+https://github.com/markqvist/Reticulum.git@${RNS_REFERENCE_COMMIT}"

      - name: Check deterministic RNS oracle
        run: |
          test "$(.venv/bin/rnid --version)" = "rnid ${RNS_REFERENCE_VERSION}"
          .venv/bin/python scripts/rns_compatibility_oracle.py --check testdata/rns-1.4.2-golden.json

      - name: End-to-end Reticulum compatibility
        run: |
          go build -buildmode=pie -trimpath -buildvcs=false -o "${BINARY_BASENAME}" .
          ./"${BINARY_BASENAME}" --prefix 0 --workers 2 --out ci_identity
          .venv/bin/python verify.py ci_identity
          .venv/bin/rnid -i ci_identity -H lxmf.delivery

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [platform-tests, security-tests, compatibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          out="${BINARY_BASENAME}-${GOOS}-${GOARCH}${suffix}"
          go build -buildmode=pie -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o "$out" .
          sha256sum "$out" | tee "${out}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY_BASENAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ env.BINARY_BASENAME }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 60
