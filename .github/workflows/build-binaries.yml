name: Build binaries

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
              echo 'Invalid release tag: expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N'
              exit 1
            fi
            version="$REF_NAME"
          else
            version="main-${COMMIT:0:12}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet release targets and run race and fuzz checks
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" {print $2}' go.mod)"
          make lint
          go test -race -count=1 ./...
          make fuzz
      - name: Install the pinned scanner and check the source
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...
      - name: Build all release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all
      - uses: ./.github/actions/upload-binary
        with:
          binary: lxmf-vanity-linux-amd64
      - uses: ./.github/actions/upload-binary
        with:
          binary: lxmf-vanity-linux-arm64
      - uses: ./.github/actions/upload-binary
        with:
          binary: lxmf-vanity-darwin-arm64
      - uses: ./.github/actions/upload-binary
        with:
          binary: lxmf-vanity-windows-amd64.exe
      - uses: ./.github/actions/upload-binary
        with:
          binary: lxmf-vanity-windows-arm64.exe

  compatibility:
    needs: build
    uses: ./.github/workflows/reference-compat.yml
    with:
      use_release_binary: true
    permissions:
      contents: read

  smoke:
    name: Native checks (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-latest, platform_tests: true}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: arm64, runner: macos-15, platform_tests: true}
          - {goos: windows, goarch: amd64, runner: windows-latest, platform_tests: true}
          - {goos: windows, goarch: arm64, runner: windows-11-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.platform_tests
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - name: Verify release toolchain
        if: matrix.platform_tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" {print $2}' go.mod | tr -d '\r')"
      - name: Native Go tests
        if: matrix.platform_tests
        shell: bash
        run: |
          set -euo pipefail
          if ! go test -count=1 ./... 2>&1 | tee go-tests.log; then
            awk '/--- FAIL: / || /^[[:space:]]*[[:alnum:]_]+_test\.go:[0-9]+:/ {print "::error::" $0}' go-tests.log
            exit 1
          fi
      - name: Python tooling tests
        if: matrix.platform_tests
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m unittest discover -p '*_test.py' 2>&1 | tee python-tests.log; then
            awk '/^(FAIL|ERROR): / || /^(AssertionError|[A-Za-z.]*Error): / {print "::error::" $0}' python-tests.log
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lxmf-vanity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifact
      - name: Verify digests and execute the downloaded artifact (never rebuild)
        id: verify
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/smoke_artifact.py --directory artifact
      - name: FIPS-only mode has the expected graceful failure
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          GODEBUG=fips140=only artifact/lxmf-vanity-linux-amd64 --prefix 0 --workers 1 --dry-run >fips-only.log 2>&1 || status=$?
          test "$status" -eq 1
          grep -Fq 'X25519 public-key derivation unavailable' fips-only.log
          if grep -Eq 'panic:|fatal error:' fips-only.log; then cat fips-only.log; exit 1; fi
          GODEBUG=fips140=only artifact/lxmf-vanity-linux-amd64 --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.goos == 'darwin'
        with:
          name: lxmf-vanity-linux-amd64
          path: original
      - name: Compare a different-host-OS build with the immutable artifact
        if: matrix.goos == 'darwin'
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          make build BINARY=rebuilt
          cmp original/lxmf-vanity-linux-amd64 rebuilt
      # The conformance steps execute only the digest-verified artifact and repository Python.
      - name: Conformance suite (all cases except slow)
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        shell: bash
        env:
          BINARY: artifact/lxmf-vanity-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          REPORT: conformance-${{ matrix.goos }}-${{ matrix.goarch }}.json
        run: python -I conformance/run.py --binary "$BINARY" --exclude-tag slow --report "$REPORT"
      - name: Conformance suite (slow cases, one retry)
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        shell: bash
        env:
          BINARY: artifact/lxmf-vanity-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          REPORT_PREFIX: conformance-slow-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python -I conformance/run.py --binary "$BINARY" --tag slow --report "$REPORT_PREFIX-attempt-$attempt.json"; then
              exit 0
            fi
            echo "::warning::Slow conformance cases failed on attempt $attempt of 2."
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: conformance-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: ignore
          path: conformance-*.json
          retention-days: 30

  pinned-reference:
    name: Pinned v1 reference (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: arm64, runner: macos-15}
          - {goos: windows, goarch: amd64, runner: windows-latest}
          - {goos: windows, goarch: arm64, runner: windows-11-arm}
    env:
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Check for the pinned reference record
        id: record
        shell: bash
        run: |
          set -euo pipefail
          if [ -f conformance/reference.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            message='conformance/reference.json does not exist yet, so the pinned v1 reference run was skipped.'
            echo "::notice title=Pinned v1 reference skipped::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the pinned release asset and verify its sha256
        id: download
        if: steps.record.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import urllib.request

          target = f"{os.environ['TARGET_OS']}-{os.environ['TARGET_ARCH']}"
          suffix = ".exe" if os.environ["TARGET_OS"] == "windows" else ""
          record = json.loads(Path("conformance/reference.json").read_text(encoding="utf-8"))
          tag = record["tag"]
          name = record["artifacts"][target]["file"]
          digest = record["artifacts"][target]["sha256"]
          if not (re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) and name == f"lxmf-vanity-{target}{suffix}"
                  and re.fullmatch(r"[0-9a-f]{64}", digest)):
              sys.exit("conformance/reference.json: unexpected tag, file name or sha256")
          with urllib.request.urlopen(f"{os.environ['RELEASE_URL']}/{tag}/{name}", timeout=120) as response:
              data = response.read(64 << 20)  # larger than any release binary; a cut-off file fails the digest
          if hashlib.sha256(data).hexdigest() != digest:
              sys.exit(f"{name}: sha256 does not match conformance/reference.json")
          Path("pinned").mkdir()
          path = Path("pinned") / name
          path.write_bytes(data)
          path.chmod(0o755)
          print(f"Verified {name} ({tag}, sha256 {digest})")
          PY
      - name: Pinned reference conformance (all cases except slow)
        if: steps.record.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="pinned/lxmf-vanity-$TARGET_OS-$TARGET_ARCH"
          if [ "$TARGET_OS" = windows ]; then binary="$binary.exe"; fi
          python -I conformance/run.py --binary "$binary" --exclude-tag slow --report "conformance-pinned-$TARGET_OS-$TARGET_ARCH.json"
      - name: Pinned reference conformance (slow cases, one retry)
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          binary="pinned/lxmf-vanity-$TARGET_OS-$TARGET_ARCH"
          if [ "$TARGET_OS" = windows ]; then binary="$binary.exe"; fi
          for attempt in 1 2; do
            if python -I conformance/run.py --binary "$binary" --tag slow --report "conformance-pinned-slow-$TARGET_OS-$TARGET_ARCH-attempt-$attempt.json"; then
              exit 0
            fi
            echo "::warning::Slow conformance cases failed on attempt $attempt of 2."
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: conformance-pinned-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: ignore
          path: conformance-pinned-*.json
          retention-days: 30

  attest:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, smoke, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No checkout, downloaded executable, project script or dependency install.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lxmf-vanity-*
          path: artifacts
          merge-multiple: true
      - name: Check immutable artifact bundle digests
        working-directory: artifacts
        run: |
          set -euo pipefail
          for file in *.sha256; do sha256sum -c "$file"; done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/lxmf-vanity-linux-amd64
            artifacts/lxmf-vanity-linux-arm64
            artifacts/lxmf-vanity-darwin-arm64
            artifacts/lxmf-vanity-windows-amd64.exe
            artifacts/lxmf-vanity-windows-arm64.exe
          create-storage-record: false

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Publication consumes this run's smoke-tested, attested bytes only.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lxmf-vanity-*
          path: artifacts
          merge-multiple: true
      - name: Publish the owner-created tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        working-directory: artifacts
        run: |
          set -euo pipefail
          for file in *.sha256; do sha256sum -c "$file"; done
          args=(release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          gh "${args[@]}" ./*
