name: Build binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BINARY_BASENAME: lxmf-vanity
  GOTOOLCHAIN: local
  RELEASE_GO: '1.27.1'
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  platform-tests:
    name: Tests (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.8', '1.27.1']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # No external Go modules.
      - name: Go unit and CLI tests
        run: go test -count=1 ./...

  security-tests:
    name: Security, race and fuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.RELEASE_GO }}
          cache: false
      - name: Go security checks
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go test -run '^$' -fuzz '^FuzzAddressMatcher$' -fuzztime=10s
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: Verification and build-script tests
        run: python3 -m unittest discover -v -p '*_test.py'
      - name: FIPS-only mode fails gracefully
        run: |
          CGO_ENABLED=0 go build -buildmode=pie -trimpath -buildvcs=false -o "${BINARY_BASENAME}" .
          if GODEBUG=fips140=only ./"${BINARY_BASENAME}" --prefix 0 --workers 1 --dry-run >fips-only.log 2>&1; then
            echo "expected X25519 to be unavailable in FIPS-only mode"
            exit 1
          fi
          if grep -q "panic:" fips-only.log; then
            cat fips-only.log
            exit 1
          fi
          grep -q "X25519 public-key derivation unavailable" fips-only.log

  compatibility:
    name: RNS ${{ matrix.reference.version }} (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        reference:
          - version: '1.4.2'
            commit: b48b96e61676504e0a4e527b33b9a0b4495c6872
          - version: '1.5.2'
            commit: ea98db4f53dcf0defc0e71a16e60d28b1229c4e6
        provider: [pyca, internal]
    env:
      PYTHONPATH: ${{ github.workspace }}/.reference-rns
      RNS_VERSION: ${{ matrix.reference.version }}
      RNS_PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out the exact Reticulum reference
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: markqvist/Reticulum
          ref: ${{ matrix.reference.commit }}
          path: .reference-rns
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.RELEASE_GO }}
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Install reference test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-reference.txt
      - name: Check vectors, Go output and actual rnid imports
        run: |
          CGO_ENABLED=0 go build -buildmode=pie -trimpath -buildvcs=false -o "${BINARY_BASENAME}" .
          .venv/bin/python scripts/rns_compatibility_oracle.py \
            --check testdata/rns-identity-vectors.json --binary "${BINARY_BASENAME}" \
            --expect-rns-version "$RNS_VERSION" --provider "$RNS_PROVIDER"

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [platform-tests, security-tests, compatibility]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.RELEASE_GO }}
          cache: false
      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          out="${BINARY_BASENAME}-${GOOS}-${GOARCH}${suffix}"
          go build -buildmode=pie -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o "$out" .
          sha256sum "$out" > "${out}.sha256"
          go version -m "$out" > "${out}.build-info.txt"
          git rev-parse HEAD >> "${out}.build-info.txt"
          echo "binary=$out" >> "$GITHUB_OUTPUT"
      - name: Scan the compiled target binary
        env:
          TARGET_BINARY: ${{ steps.build.outputs.binary }}
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -mode=binary "$TARGET_BINARY"
      - name: Attest trusted main-branch builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.build.outputs.binary }}
          create-storage-record: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY_BASENAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ steps.build.outputs.binary }}
            ${{ steps.build.outputs.binary }}.sha256
            ${{ steps.build.outputs.binary }}.build-info.txt
          retention-days: 60
